name: Deploy to dev

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          echo "Deploying $GITHUB_SHA to dev"
          echo "Triggered by $GITHUB_ACTOR on $GITHUB_REF_NAME"
